# Inji Verify (compose service verify-service, context path /v1/verify) at https://verify.inji.test:18451.
# INJI_VP_SUBMISSION_BASE_URL in docker-compose.yml points here, so request_uri and response_uri use this name.
server {
    listen 18451 ssl;
    server_name verify.inji.test;

    ssl_certificate     /pki/tls/verify.inji.test.crt;
    ssl_certificate_key /pki/tls/verify.inji.test.key;

    location / {
        set $verify_backend http://verify-service:8080;
        proxy_pass $verify_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port 18451;
    }
}
