# Inji Certify (compose service certify, servlet path /v1/certify) at https://certify.inji.test:18450.
#
# mosip.certify.domain.url in compose/certify/config/certify-default.properties is this origin without a path, so
# Certify's credential issuer identifier is https://certify.inji.test:18450 and OpenID4VCI 1.0 (section 12.2.2)
# puts its metadata at the root: /.well-known/openid-credential-issuer. Certify serves its well-known documents
# under /v1/certify/.well-known/, so the root routes below map them, as upstream's certify-nginx.conf
# (compose/certify/certify-nginx.conf) does. Everything else under /v1/certify/ goes through unchanged.
#
# Differences from upstream's certify-nginx.conf, and why:
# - TLS with the run-time test CA: the conformance suite requires https for the issuer and every endpoint.
# - The client certificate is requested but not checked (optional_no_ca). The suite's mTLS sender-constraint
#   variant presents its certificate at the TLS layer; Certify has no mTLS support, so the proxy only hands the
#   certificate on in a header for diagnostics, and the conformance result shows what Certify does with it.
# - The authorization server metadata may get one added field (certify-as-metadata/, CERTIFY_AS_METADATA).
# - No CORS headers and no static file root: only servers (the suite, the runner, the testrigs) call this name.
server {
    listen 18450 ssl;
    server_name certify.inji.test;

    ssl_certificate     /pki/tls/certify.inji.test.crt;
    ssl_certificate_key /pki/tls/certify.inji.test.key;
    ssl_verify_client   optional_no_ca;

    # Resolved per request (see nginx.conf): the proxy starts even when the active profiles leave Certify out.
    set $certify_backend http://certify:8090;

    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Port 18450;
    proxy_set_header X-SSL-Client-Cert $ssl_client_escaped_cert;

    # Root well-known documents (issuer metadata, OAuth AS metadata of Certify as its own AS, key set, DID).
    location = /.well-known/openid-credential-issuer {
        proxy_pass $certify_backend/v1/certify/.well-known/openid-credential-issuer$is_args$args;
    }
    location = /.well-known/oauth-authorization-server {
        proxy_pass $certify_backend/v1/certify/.well-known/oauth-authorization-server$is_args$args;
        # CERTIFY_AS_METADATA picks this file (docker-compose.yml): as-is, or add-authorization-endpoint.
        include /etc/nginx/harness/certify-as-metadata.conf;
    }
    location = /.well-known/jwks.json {
        proxy_pass $certify_backend/v1/certify/.well-known/jwks.json$is_args$args;
    }
    location = /.well-known/did.json {
        proxy_pass $certify_backend/v1/certify/.well-known/did.json$is_args$args;
    }

    # The API: token, nonce, credential, offers, credential configurations, status lists, actuator.
    location /v1/certify/ {
        proxy_pass $certify_backend;
    }

    location / {
        return 404;
    }
}
