# TLS front end for the systems under test (service tls-proxy in docker-compose.yml).
#
# The conformance suite rejects plain-http request_uri, response_uri and issuer URLs, so Inji Verify and Inji
# Certify get HTTPS names that only exist on the compose network: verify.inji.test:18451 and certify.inji.test:18450
# (network aliases of this container). Certificates come from the run-time test CA made by pki-init
# ($HARNESS_RUN_DIR/pki, mounted at /pki). The same port is used inside the network and on the host, so a URL that
# Inji puts into a request object works from both sides.
#
# One file per system under test in sites/. Each proxies to its backend through a variable, which makes nginx
# resolve the name per request through Docker's DNS: the proxy starts even when the active compose profiles leave a
# backend out, and answers 502 for that name until the backend exists.

user nginx;
worker_processes 2;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format main '$remote_addr [$time_local] $host:$server_port "$request" $status $body_bytes_sent '
                    '$request_time "$http_user_agent"';
    access_log /dev/stdout main;
    error_log  /dev/stderr warn;

    # Docker's embedded DNS server; short validity so a restarted backend is found again quickly.
    resolver 127.0.0.11 ipv6=off valid=10s;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:1m;

    # Inji Verify long-polls the request status for up to 55 s; leave room above that.
    proxy_read_timeout 120s;
    proxy_send_timeout 120s;
    # Presentations (vp_token) and credential configurations with embedded templates can be large.
    client_max_body_size 10m;
    proxy_buffer_size 32k;
    proxy_buffers 8 32k;
    large_client_header_buffers 4 32k;

    # Health endpoint for the compose healthcheck. Plain HTTP inside the container, never published.
    server {
        listen 18459;
        location = /healthz {
            access_log off;
            default_type text/plain;
            return 200 "ok\n";
        }
        location / {
            return 404;
        }
    }

    include /etc/nginx/harness/sites/*.conf;
}
