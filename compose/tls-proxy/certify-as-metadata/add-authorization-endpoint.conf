# CERTIFY_AS_METADATA=add-authorization-endpoint (the default): the one change the harness makes to what Inji
# Certify publishes, so the issuer plan can get past its first condition.
#
# Certify's OAuth authorization server metadata lists the authorization_code grant but has no
# authorization_endpoint (OAuthAuthorizationServerMetadataDTO has no such field, measured on 2026-10-14), and the
# suite's CheckServerConfiguration stops every flow module without one, also in the pre-authorized code flow that
# never calls it. This inserts "authorization_endpoint" in front of "token_endpoint". The URL is a placeholder that
# nothing calls in this flow. The response carries X-Harness-Shim; the runner records it in results.json
# ("workarounds") and names it next to the gate result.
# Turn it off with CERTIFY_AS_METADATA=as-is to reproduce the finding:
# docs/findings/certify-as-metadata-authorization-endpoint.md.
proxy_set_header Accept-Encoding "";
sub_filter_types application/json;
sub_filter_once on;
sub_filter '"token_endpoint":' '"authorization_endpoint":"https://certify.inji.test:18450/v1/certify/oauth/authorize","token_endpoint":';
add_header X-Harness-Shim "authorization_endpoint added by the TLS proxy" always;
