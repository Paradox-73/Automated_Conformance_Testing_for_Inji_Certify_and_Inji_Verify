# Spring profile "preauth" of Inji Certify for the conformance harness (team file, MPL-2.0).
#
# docker-compose.yml starts Certify with active_profile_env=default,csvdp-farmer,preauth. Spring reads the profiles
# in that order and a later one overrides an earlier one, so this file only holds what differs from the upstream
# farmer profile (certify-csvdp-farmer.properties, unchanged):
#
# - Credential data come from the pre-authorized offer itself. The issuer's back office (here: the harness runner)
#   calls POST /v1/certify/pre-authorized-data with the claims; the wallet (here: the conformance suite) redeems
#   the offer at Certify's own token endpoint. PreAuthDataProviderPlugin reads the claims back from the access
#   token (services/PreAuthIssuanceServiceImpl.java), so no identity system or CSV registry is involved.
#   Source: docs/technical_docs/Pre_Authorized_Code.md of inji-certify release-1.0.x.
# - The issuer DID points at the harness host name instead of the upstream example tunnel URL. Certify only uses
#   it to fill the issuer of credentials whose template asks for it; nothing resolves it during a conformance run.

mosip.certify.integration.data-provider-plugin=PreAuthDataProviderPlugin

mosip.certify.data-provider-plugin.did-url=did:web:certify.inji.test%3A18450
