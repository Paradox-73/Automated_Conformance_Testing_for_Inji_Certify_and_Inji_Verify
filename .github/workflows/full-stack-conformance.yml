# OpenID conformance of Inji Certify and Inji Verify on every change, release and week.
#
# Jobs:
#   checks       bash scripts/check.sh all (strict: a missing tool fails)
#   conformance  per component (matrix certify, verify): the stack, the suite plan, the api-testrig step with the
#                MinIO upload, the report; fails when the component's gate fails
#   combined     one consolidated report and badge for both components, and the diff against the last
#                successful run on main
#   full-stack   ./run-full-stack-conformance.sh from scratch (releases, the weekly schedule, manual runs)
#
# Inji release pipelines call it with new image digests (workflow_call); see .github/examples/inji-release-caller.yml.
# The same steps run on a developer machine with: bash scripts/ci-local.sh certify|verify
name: full-stack-conformance

on:
  push:
  pull_request:
  release:
    types: [published]
  schedule:
    - cron: "17 3 * * 1" # Mondays 03:17 UTC
  workflow_dispatch:
    inputs:
      component:
        description: "Which component to test"
        type: choice
        options: [both, certify, verify]
        default: both
      track:
        description: "gate (1.0 Final plans, gating) or haip (readiness, never gating)"
        type: choice
        options: [gate, haip]
        default: gate
      strict:
        description: "Stale benchmark entries fail the run (off: they only warn)"
        type: boolean
        default: true
      certify_image:
        description: "Inji Certify image override, for example injistackqa/inji-certify-with-plugins@sha256:..."
        type: string
        default: ""
      verify_image:
        description: "Inji Verify service image override"
        type: string
        default: ""
  workflow_call:
    inputs:
      component:
        type: string
        default: both
      track:
        type: string
        default: gate
      strict:
        type: boolean
        default: true
      certify_image:
        type: string
        default: ""
      verify_image:
        type: string
        default: ""

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read # download the artifact of the last successful run on main

env:
  CI: "true"
  NO_COLOR: "1"
  HARNESS_RUN_DIR: ${{ github.workspace }}/run
  CERTIFY_IMAGE_OVERRIDE: ${{ inputs.certify_image }}
  VERIFY_IMAGE_OVERRIDE: ${{ inputs.verify_image }}

jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: runner/pyproject.toml
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      # The runner image ships an older shellcheck (0.9.0) that reports false SC2317 notes in trap handlers, so the
      # pinned versions go first on PATH. Checksums: actionlint's published checksums file; shellcheck publishes
      # none, so the value is the sha256 of the release file as downloaded on 2026-10-14.
      - name: Install shellcheck 0.11.0 and actionlint 1.7.12
        run: |
          bin="$HARNESS_RUN_DIR/tools/bin"
          mkdir -p "$bin" "$RUNNER_TEMP/lint"
          cd "$RUNNER_TEMP/lint"
          curl -sSfLO https://github.com/koalaman/shellcheck/releases/download/v0.11.0/shellcheck-v0.11.0.linux.x86_64.tar.xz
          curl -sSfLO https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz
          sha256sum -c - <<'EOF'
          8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198  shellcheck-v0.11.0.linux.x86_64.tar.xz
          8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  actionlint_1.7.12_linux_amd64.tar.gz
          EOF
          tar -xJf shellcheck-v0.11.0.linux.x86_64.tar.xz --strip-components=1 -C "$bin" shellcheck-v0.11.0/shellcheck
          tar -xzf actionlint_1.7.12_linux_amd64.tar.gz -C "$bin" actionlint
          echo "$bin" >>"$GITHUB_PATH"
      - name: bash scripts/check.sh all
        run: bash scripts/check.sh all

  conformance:
    needs: checks
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        # Both components, unless a manual or calling run names one.
        component: ${{ fromJSON(inputs.component == 'certify' && '["certify"]' || inputs.component == 'verify' && '["verify"]' || '["certify","verify"]') }}
    steps:
      # The standard runner has about 14 GB free; the images, their cache archive and the Maven build need more.
      - name: Free disk space (preinstalled SDKs this job does not use)
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /usr/share/swift             /opt/hostedtoolcache/CodeQL /usr/local/share/powershell /usr/local/share/chromium
          df -h /
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Image overrides
        run: |
          if [ -n "$CERTIFY_IMAGE_OVERRIDE" ]; then echo "CERTIFY_IMAGE=$CERTIFY_IMAGE_OVERRIDE" >>"$GITHUB_ENV"; fi
          if [ -n "$VERIFY_IMAGE_OVERRIDE" ]; then echo "VERIFY_IMAGE=$VERIFY_IMAGE_OVERRIDE" >>"$GITHUB_ENV"; fi
      - name: Image list
        id: images
        run: |
          bash scripts/dc.sh --profile '*' config --images | sort >"$RUNNER_TEMP/images.txt"
          echo "key=images-${{ hashFiles('docker-compose.yml', 'runner/**', 'testrigs/Dockerfile') }}-$(sha256sum "$RUNNER_TEMP/images.txt" | cut -c1-16)" >>"$GITHUB_OUTPUT"
      - name: Image cache
        id: cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ runner.temp }}/images.tar
          key: ${{ steps.images.outputs.key }}
      - name: Load cached images
        if: steps.cache.outputs.cache-hit == 'true'
        run: docker load -i "$RUNNER_TEMP/images.tar"
      - name: Pull and build (runner, testrig jars and image)
        run: ./run-full-stack-conformance.sh --prepare-only
      - name: Save images for the cache
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          mapfile -t images < <(grep -v '^$' "$RUNNER_TEMP/images.txt"; echo ps01-harness/testrig:local)
          docker save -o "$RUNNER_TEMP/images.tar" "${images[@]}"
      - name: Conformance run (${{ matrix.component }})
        run: |
          args=(--component "${{ matrix.component }}" --out "ci-${{ matrix.component }}" --track "${{ inputs.track || 'gate' }}")
          if [ "${{ inputs.strict }}" = "false" ]; then args+=(--allow-stale); fi
          ./run-conformance.sh "${args[@]}"
      - name: Job summary
        if: always()
        run: |
          summary="$HARNESS_RUN_DIR/reports/ci-${{ matrix.component }}/report/summary.md"
          if [ -f "$summary" ]; then cat "$summary" >>"$GITHUB_STEP_SUMMARY"; else echo "No report for ${{ matrix.component }}." >>"$GITHUB_STEP_SUMMARY"; fi
      - name: Remove key material from the artifact
        if: always()
        run: rm -rf "$HARNESS_RUN_DIR"/reports/*/*/suite-scripts "$HARNESS_RUN_DIR"/reports/*/*/exports
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: conformance-${{ matrix.component }}
          path: ${{ env.HARNESS_RUN_DIR }}/reports/ci-${{ matrix.component }}
          if-no-files-found: warn
          retention-days: 30

  combined:
    needs: conformance
    if: always() && needs.conformance.result != 'skipped'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - run: pip install ./runner
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          pattern: conformance-*
          path: runs
      - name: Previous successful run on main
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          id=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow full-stack-conformance.yml --branch main \
            --status success --limit 1 --json databaseId --jq '.[0].databaseId // empty')
          if [ -n "$id" ] && [ "$id" != "$GITHUB_RUN_ID" ]; then
            gh run download "$id" --repo "$GITHUB_REPOSITORY" --pattern 'conformance-*' --dir previous || true
          fi
      - name: Consolidated report, badge and diff
        run: |
          set -u
          runs=()
          for folder in runs/conformance-*; do [ -d "$folder" ] && runs+=(--run "$folder"); done
          if [ ${#runs[@]} -eq 0 ]; then echo "no component results" >>"$GITHUB_STEP_SUMMARY"; exit 1; fi
          combined=()
          if [ ${#runs[@]} -eq 4 ]; then combined=(--combined); fi
          inji-conformance report "${runs[@]}" "${combined[@]}" --out combined
          cat combined/summary.md >>"$GITHUB_STEP_SUMMARY"
          for component in certify verify; do
            now=runs/conformance-$component/$component/results.json
            before=previous/conformance-$component/$component/results.json
            if [ -f "$now" ] && [ -f "$before" ]; then
              echo "### Diff against main ($component)" >>"$GITHUB_STEP_SUMMARY"
              inji-conformance diff "$before" "$now" --out "combined/diff-$component" >>"$GITHUB_STEP_SUMMARY" || true
            fi
          done
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: combined-report
          path: combined
          if-no-files-found: warn
          retention-days: 90

  full-stack:
    needs: checks
    if: github.event_name == 'release' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      # The standard runner has about 14 GB free; the images, their cache archive and the Maven build need more.
      - name: Free disk space (preinstalled SDKs this job does not use)
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /usr/share/swift             /opt/hostedtoolcache/CodeQL /usr/local/share/powershell /usr/local/share/chromium
          df -h /
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Image overrides
        run: |
          if [ -n "$CERTIFY_IMAGE_OVERRIDE" ]; then echo "CERTIFY_IMAGE=$CERTIFY_IMAGE_OVERRIDE" >>"$GITHUB_ENV"; fi
          if [ -n "$VERIFY_IMAGE_OVERRIDE" ]; then echo "VERIFY_IMAGE=$VERIFY_IMAGE_OVERRIDE" >>"$GITHUB_ENV"; fi
      - name: ./run-full-stack-conformance.sh
        run: |
          args=(--out ci-full-stack --track "${{ inputs.track || 'gate' }}")
          if [ "${{ inputs.strict }}" = "false" ]; then args+=(--allow-stale); fi
          ./run-full-stack-conformance.sh "${args[@]}"
      - name: Job summary and key removal
        if: always()
        run: |
          cat "$HARNESS_RUN_DIR/reports/ci-full-stack/report/summary.md" >>"$GITHUB_STEP_SUMMARY" 2>/dev/null || true
          rm -rf "$HARNESS_RUN_DIR"/reports/*/*/suite-scripts "$HARNESS_RUN_DIR"/reports/*/*/exports
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: full-stack
          path: ${{ env.HARNESS_RUN_DIR }}/reports/ci-full-stack
          if-no-files-found: warn
          retention-days: 90
